services:
  error-logger:
    build: .
    container_name: error-logger
    ports:
      - "${HOST_PORT:-${PORT:-9000}}:${PORT:-9000}"
    environment:
      - PORT=${PORT:-9000}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - CAPACITY=${CAPACITY:-1000}
      - DISABLE_DELETE=${DISABLE_DELETE:-false}
      - DISABLE_CONSOLE_LOG=${DISABLE_CONSOLE_LOG:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped


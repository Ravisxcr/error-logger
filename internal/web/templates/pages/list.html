{{define "content"}}
{{with .Data}}
{{if .Events}}
<table>
	<tr>
		<th>Time</th>
		<th>Level</th>
		<th>Kind</th>
		<th>Summary</th>
		<th>Seen</th>
	</tr>
	{{range .Events}}
	<tr>
		<td>{{.Time}}</td>
		<td><span class="badge level-{{.Level}}">{{.Level}}</span></td>
		<td>{{.Kind}}</td>
		<td><a href="/events/{{.ID}}">{{.Summary}}</a></td>
		<td>{{if gt .Count 1}}<span class="badge count">&times;{{.Count}}</span>{{else}}1{{end}}</td>
	</tr>
	{{end}}
</table>
{{else}}
<p class="empty">No issues captured yet for this project.</p>
{{end}}
{{end}}
{{end}}

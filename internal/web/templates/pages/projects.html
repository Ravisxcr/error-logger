{{define "content"}}
{{with .Data}}
{{if .Projects}}
<table>
	<tr>
		<th>Project</th>
		<th>Issues</th>
		<th>Events</th>
		<th>Last seen</th>
	</tr>
	{{range .Projects}}
	<tr>
		<td><a href="/projects/{{.ProjectID}}">{{.ProjectID}}</a></td>
		<td>{{.Issues}}</td>
		<td>{{.Events}}</td>
		<td>{{.LastSeen}}</td>
	</tr>
	{{end}}
</table>
{{else}}
<p class="empty">No events captured yet. Point your Sentry SDK's DSN at this server and trigger an error.</p>
{{end}}
{{end}}
{{end}}

{{define "content"}}
{{with .Data}}
{{if .Projects}}
<table>
	<tr>
		<th>Project</th>
		<th>Issues</th>
		<th>Events</th>
		<th>Last seen</th>
		<th></th>
	</tr>
	{{range .Projects}}
	<tr>
		<td><a href="/projects/{{.ProjectID}}">{{.ProjectID}}</a></td>
		<td>{{.Issues}}</td>
		<td>{{.Events}}</td>
		<td>{{.LastSeen}}</td>
		<td>
			<form class="delete-form" method="post" action="/projects/{{.ProjectID}}/delete" onsubmit="return confirm('Delete project {{.ProjectID}} and all its captured events?')">
				<button class="btn-delete" type="submit">Delete</button>
			</form>
		</td>
	</tr>
	{{end}}
</table>
{{else}}
<p class="empty">No events captured yet. Point your Sentry SDK's DSN at this server and trigger an error.</p>
{{end}}
{{end}}
{{end}}
